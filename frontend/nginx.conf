server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Docker may replace backend containers during a rebuild. Resolve Compose
  # service names periodically instead of pinning their startup IP addresses.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $balancer_api api:8000;
  set $ais_api ais-emulator:8001;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://$balancer_api$request_uri; }
  location /ingest/ { proxy_pass http://$balancer_api$request_uri; }
  location = /health { proxy_pass http://$balancer_api$request_uri; }
  location = /metrics { proxy_pass http://$balancer_api$request_uri; }
  location = /ready { proxy_pass http://$balancer_api$request_uri; }
  location = /docs { proxy_pass http://$balancer_api$request_uri; }
  location = /openapi.json { proxy_pass http://$balancer_api$request_uri; }
  location /sim/ { proxy_pass http://$ais_api$request_uri; }
  location /ais/ { rewrite ^/ais/(.*)$ /$1 break; proxy_pass http://$ais_api; }
  location = /ais { proxy_pass http://$ais_api/; }
  location /ws/live {
    proxy_pass http://$balancer_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
